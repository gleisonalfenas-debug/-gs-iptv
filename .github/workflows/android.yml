name: Gerar app Android TV

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar chave de assinatura
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Falta o segredo KEYSTORE_BASE64. Veja o LEIA-ME.md, passo 3."
            exit 1
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/gs.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/gs.jks" >> "$GITHUB_ENV"

      - name: Compilar APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Preparar arquivos da versão
        run: |
          V="1.0.${{ github.run_number }}"
          cp android/app/build/outputs/apk/release/app-release.apk gs-iptv.apk
          cat > update.json <<JSON
          {"versionCode": ${{ github.run_number }}, "versionName": "$V", "apkUrl": "https://github.com/${{ github.repository }}/releases/latest/download/gs-iptv.apk"}
          JSON
          echo "VERSAO=$V" >> "$GITHUB_ENV"

      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSAO }}
          name: GS IPTV ${{ env.VERSAO }}
          make_latest: true
          files: |
            gs-iptv.apk
            update.json
