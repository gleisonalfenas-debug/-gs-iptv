name: Gerar app Android TV

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/keystore/gs.jks
          KEYSTORE_PASSWORD: JSGXNWAMm04uqKnImBDq
        run: gradle -p android assembleRelease --no-daemon

      - name: Preparar arquivos da versão
        run: |
          V="1.0.${{ github.run_number }}"
          cp android/app/build/outputs/apk/release/app-release.apk gs-iptv.apk
          cat > update.json <<JSON
          {"versionCode": ${{ github.run_number }}, "versionName": "$V", "apkUrl": "https://github.com/${{ github.repository }}/releases/latest/download/gs-iptv.apk"}
          JSON
          echo "VERSAO=$V" >> "$GITHUB_ENV"

      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSAO }}
          name: GS IPTV ${{ env.VERSAO }}
          make_latest: true
          files: |
            gs-iptv.apk
            update.json
