<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GS IPTV – Enviar lista</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Roboto,sans-serif;color:#fff;background:linear-gradient(180deg,#b3121f 0%,#6d0a12 100%)}
.wrap{max-width:460px;margin:0 auto;padding:36px 22px 32px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:12px;background:#fff;color:#b3121f;font-weight:900;font-size:19px;display:flex;align-items:center;justify-content:center}
.brand b{font-size:22px;display:block}.brand small{color:#f3d6d8;font-size:14px}
h1{margin:4px 0 0;font-size:27px;line-height:1.15}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:rgba(0,0,0,.25);border-radius:12px;padding:5px}
.tabs button{height:44px;border:0;border-radius:9px;background:transparent;color:#fff;font-size:16px;font-weight:600}
.tabs button.on{background:#fff;color:#8a0f19}
label{font-size:15px;font-weight:500;display:block;margin-bottom:7px}
input{width:100%;height:52px;border-radius:10px;border:0;padding:0 14px;font-size:17px;color:#1a1a1a;background:#fff}
.hide{display:none}
.send{height:56px;border:0;border-radius:12px;background:#f0c45c;color:#3a2400;font-size:19px;font-weight:800;margin-top:4px}
.send:disabled{opacity:.6}
.msg{border-radius:10px;padding:12px 14px;font-size:15px;background:rgba(0,0,0,.25);display:flex;gap:10px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:#45d483;flex-shrink:0}
.msg.err .dot{background:#ffb4b4}
</style>
</head>
<body>
<form class="wrap" id="f">
  <div class="brand"><div class="logo">GS</div><div><b>GS IPTV</b><small>Conectado à TV</small></div></div>
  <h1>Enviar lista para a TV</h1>
  <div class="tabs" role="tablist">
    <button type="button" class="on" id="tM" role="tab" aria-selected="true">Link M3U</button>
    <button type="button" id="tX" role="tab" aria-selected="false">Xtream Codes</button>
  </div>
  <input type="hidden" name="type" id="type" value="m3u">
  <div><label for="name">Nome da lista</label><input id="name" name="name" value="{{LIST_NAME}}"></div>
  <div id="m3u">
    <label for="url">Link da lista (M3U / M3U8)</label>
    <input id="url" name="url" type="url" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="http://seu-provedor.com/lista.m3u">
  </div>
  <div id="xt" class="hide" style="display:none;flex-direction:column;gap:14px">
    <div><label for="server">Servidor (URL)</label><input id="server" name="server" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="http://servidor.com:8080"></div>
    <div><label for="user">Usuário</label><input id="user" name="user" autocapitalize="off" autocorrect="off"></div>
    <div><label for="pass">Senha</label><input id="pass" name="pass" type="password"></div>
  </div>
  <div><label for="epg">Link do guia EPG (opcional)</label><input id="epg" name="epg" type="url" inputmode="url" autocapitalize="off" placeholder="http://…/epg.xml"></div>
  <button class="send" id="go" type="submit">Enviar para a TV</button>
  <div class="msg" id="msg"><span class="dot"></span><span id="mt">A TV carrega os canais assim que a lista chegar.</span></div>
</form>
<script>
var tM=document.getElementById('tM'),tX=document.getElementById('tX'),type=document.getElementById('type');
function mode(x){type.value=x;tM.className=x==='m3u'?'on':'';tX.className=x==='xtream'?'on':'';
 tM.setAttribute('aria-selected',x==='m3u');tX.setAttribute('aria-selected',x==='xtream');
 document.getElementById('m3u').style.display=x==='m3u'?'block':'none';
 document.getElementById('xt').style.display=x==='xtream'?'flex':'none';}
tM.onclick=function(){mode('m3u')};tX.onclick=function(){mode('xtream')};
document.getElementById('f').onsubmit=function(e){e.preventDefault();
 var go=document.getElementById('go'),msg=document.getElementById('msg'),mt=document.getElementById('mt');
 go.disabled=true;go.textContent='Enviando…';
 fetch('/send',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(new FormData(this)).toString()})
 .then(function(r){return r.json()}).then(function(j){
   if(j.ok){msg.className='msg';mt.textContent='Pronto! Lista enviada. Olhe a TV.';go.textContent='Enviado ✓';}
   else{msg.className='msg err';mt.textContent=j.error||'Erro ao enviar.';go.disabled=false;go.textContent='Enviar para a TV';}
 }).catch(function(){msg.className='msg err';mt.textContent='Não consegui falar com a TV. Celular e TV estão no mesmo Wi-Fi?';go.disabled=false;go.textContent='Enviar para a TV';});
};
</script>
</body>
</html>
