<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GS IPTV – Entrar</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Roboto,sans-serif;color:#fff;background:linear-gradient(180deg,#b3121f 0%,#6d0a12 100%)}
.wrap{max-width:460px;margin:0 auto;padding:36px 22px 32px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:12px;background:#fff;color:#b3121f;font-weight:900;font-size:19px;display:flex;align-items:center;justify-content:center}
.brand b{font-size:22px;display:block}.brand small{color:#f3d6d8;font-size:14px}
h1{margin:4px 0 0;font-size:27px;line-height:1.15}
.sub{margin:-8px 0 0;color:#f3d6d8;font-size:16px}
label{font-size:15px;font-weight:500;display:block;margin-bottom:7px}
input{width:100%;height:52px;border-radius:10px;border:0;padding:0 14px;font-size:17px;color:#1a1a1a;background:#fff}
.pw{position:relative}.pw button{position:absolute;right:6px;top:6px;height:40px;padding:0 12px;border:0;border-radius:8px;background:#eee;color:#8a0f19;font-weight:700;font-size:14px}
.send{height:56px;border:0;border-radius:12px;background:#f0c45c;color:#3a2400;font-size:19px;font-weight:800;margin-top:4px}
.send:disabled{opacity:.6}
.msg{border-radius:10px;padding:12px 14px;font-size:15px;background:rgba(0,0,0,.25);display:flex;gap:10px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:#45d483;flex-shrink:0}
.msg.err .dot{background:#ffb4b4}
</style>
</head>
<body>
<form class="wrap" id="f" autocomplete="on">
  <div class="brand"><div class="logo">GS</div><div><b>GS IPTV</b><small>Conectado à TV</small></div></div>
  <h1>Entrar no GS IPTV</h1>
  <p class="sub">Cole o link da sua lista e digite seu usuário e senha.</p>
  <div id="urlBox">
    <label for="url">Link da lista</label>
    <input id="url" name="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="http://servidor.com:8080">
  </div>
  <div>
    <label for="user">Usuário</label>
    <input id="user" name="user" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="username" required>
  </div>
  <div>
    <label for="pass">Senha</label>
    <div class="pw">
      <input id="pass" name="pass" type="password" autocomplete="current-password" required>
      <button type="button" id="show" aria-label="Mostrar senha">Ver</button>
    </div>
  </div>
  <button class="send" id="go" type="submit">Entrar</button>
  <div class="msg" id="msg"><span class="dot"></span><span id="mt">A TV carrega os canais assim que o login for confirmado.</span></div>
</form>
<script>
var url=document.getElementById('url'),user=document.getElementById('user'),pass=document.getElementById('pass');
if('{{FIXED}}'==='1'){document.getElementById('urlBox').style.display='none';
 document.querySelector('.sub').textContent='Digite o usuário e a senha que você recebeu.';}
// Se colar um link que já tem usuário e senha, preenche sozinho
url.addEventListener('input',function(){
 try{var u=new URL(url.value.trim());var a=u.searchParams.get('username'),b=u.searchParams.get('password');
  if(a&&!user.value)user.value=a; if(b&&!pass.value)pass.value=b;}catch(e){}
});
document.getElementById('show').onclick=function(){var t=pass.type==='password';pass.type=t?'text':'password';this.textContent=t?'Ocultar':'Ver';};
document.getElementById('f').onsubmit=function(e){e.preventDefault();
 var go=document.getElementById('go'),msg=document.getElementById('msg'),mt=document.getElementById('mt');
 go.disabled=true;go.textContent='Conferindo…';msg.className='msg';mt.textContent='Conferindo usuário e senha…';
 fetch('/send',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(new FormData(this)).toString()})
 .then(function(r){return r.json()}).then(function(j){
   if(j.ok){mt.textContent='Pronto! Olhe a TV, os canais estão carregando.';go.textContent='Conectado ✓';}
   else{msg.className='msg err';mt.textContent=j.error||'Erro ao entrar.';go.disabled=false;go.textContent='Entrar';}
 }).catch(function(){msg.className='msg err';mt.textContent='Não consegui falar com a TV. Celular e TV estão no mesmo Wi-Fi?';go.disabled=false;go.textContent='Entrar';});
};
</script>
</body>
</html>
